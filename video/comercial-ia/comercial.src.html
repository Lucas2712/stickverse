<title>O Futuro Já Começou</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..900&family=Geist+Mono:wght@400..600&display=swap">
<style>
/* Layout: player 9:16 à esquerda, roteiro de cenas clicável à direita (empilha no celular).
   O palco 1080x1920 é o "vídeo": mundo branco fixo, igual nos dois temas. */
:root{
  --bg:#ECEAE7; --panel:#F8F7F5; --fg:#16130F; --fg2:#6B645D; --line:#D9D4CE; --accent:#FF5A1F; --accent-ink:#FFFFFF;
  --v-bg:#FFFFFF; --v-ink:#100D0A; --v-ink2:#5F5852; --v-mute:#A8A098; --v-line:#EEEAE6; --v-soft:#FFF2EA;
  --v-or:#FF5A1F; --v-or2:#FF8A3D; --v-ok:#1FB866;
  --sans:"Geist", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono:"Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F0E0D; --panel:#1A1816; --fg:#F2EFEB; --fg2:#A29A92; --line:#2F2B28; --accent:#FF6A2E; --accent-ink:#140A04; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#0F0E0D; --panel:#1A1816; --fg:#F2EFEB; --fg2:#A29A92; --line:#2F2B28; --accent:#FF6A2E; --accent-ink:#140A04; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg); color:var(--fg); font-family:var(--sans);
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));}
.app{max-width:1180px; margin:0 auto; padding-block:24px 40px; display:grid; grid-template-columns:auto minmax(0,1fr); gap:40px; align-items:start}
.player{display:flex; flex-direction:column; gap:14px; width:min(calc((100vh - 150px) * 9 / 16), 480px)}
.vp{position:relative; width:100%; aspect-ratio:9/16; max-width:100%; border-radius:22px; overflow:hidden; background:var(--v-bg);
  box-shadow:0 0 0 1px var(--line), 0 30px 70px -30px rgba(0,0,0,.35)}
#stage{position:absolute; left:0; top:0; width:1080px; height:1920px; transform-origin:0 0; overflow:hidden; background:var(--v-bg); color:var(--v-ink); font-family:var(--sans)}
.ctrl{display:flex; align-items:center; gap:10px}
.btn{appearance:none; border:1px solid var(--line); background:var(--panel); color:var(--fg); font:600 14px/1 var(--sans); height:42px; padding:0 16px; border-radius:999px; display:inline-flex; align-items:center; gap:8px; cursor:pointer}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn:focus-visible, input:focus-visible, .scene-list button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn svg{width:16px; height:16px}
#scrub{flex:1; min-width:0; accent-color:var(--accent)}
.time{font:500 13px var(--mono); color:var(--fg2); font-variant-numeric:tabular-nums; min-width:88px; text-align:right}
.opts{display:flex; gap:10px; align-items:center; font-size:13px; color:var(--fg2)}
.opts label{display:inline-flex; gap:6px; align-items:center; cursor:pointer}
.side{min-width:0; display:flex; flex-direction:column; gap:18px; padding-top:6px}
.side h1{font:800 clamp(30px,4vw,44px)/1.02 var(--sans); letter-spacing:-.035em; margin:0; text-wrap:balance}
.side h1 em{font-style:normal; color:var(--accent)}
.side p.lede{margin:0; color:var(--fg2); font-size:15px; line-height:1.55; max-width:60ch}
.meta{display:flex; flex-wrap:wrap; gap:8px}
.meta span{font:500 12px var(--mono); color:var(--fg2); border:1px solid var(--line); border-radius:999px; padding:6px 10px; letter-spacing:.02em}
.scene-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.scene-list button{all:unset; box-sizing:border-box; width:100%; cursor:pointer; display:grid; grid-template-columns:86px minmax(0,1fr); gap:14px; padding:14px 16px; border-radius:16px; background:var(--panel); border:1px solid var(--line)}
.scene-list button[aria-current="true"]{border-color:var(--accent); box-shadow:inset 3px 0 0 var(--accent)}
.scene-list .tc{font:500 12px var(--mono); color:var(--fg2); font-variant-numeric:tabular-nums; padding-top:2px}
.scene-list b{display:block; font:700 15px var(--sans); letter-spacing:-.01em; margin-bottom:4px}
.scene-list span.d{display:block; font-size:13.5px; line-height:1.5; color:var(--fg2)}
.poster{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.18); border:0; cursor:pointer; padding:0}
.poster span{width:92px; height:92px; border-radius:50%; background:var(--v-or); display:grid; place-items:center; box-shadow:0 20px 50px -10px rgba(255,90,31,.6)}
.poster svg{width:34px; height:34px; margin-left:6px; fill:#fff}
@media (max-width:820px){ .app{grid-template-columns:minmax(0,1fr); gap:28px} .player{width:min(100%, 440px); margin:0 auto} }

/* ===== Palco (o vídeo) ===== */
#stage *{box-sizing:border-box}
.layer{position:absolute; inset:0; pointer-events:none}
.scene{position:absolute; inset:0; transform-origin:540px 960px}
.abs{position:absolute; will-change:transform,opacity}
canvas.rb{position:absolute; left:0; top:0; width:1080px; height:1920px}
#glow{filter:blur(22px); opacity:.32}
.wire{position:absolute; border:2px solid var(--v-line); border-radius:28px}
.plus{position:absolute; width:26px; height:26px}
.plus:before,.plus:after{content:""; position:absolute; background:var(--v-line); left:12px; top:0; width:2px; height:26px}
.plus:after{left:0; top:12px; width:26px; height:2px}

.mask{display:inline-block; overflow:hidden; vertical-align:top; padding:0 .03em .14em; margin-bottom:-.14em}
.mask > i{display:inline-block; font-style:normal}
.hl{position:absolute; left:0; right:0; text-align:center; letter-spacing:-.05em; line-height:1; white-space:nowrap}
.or{color:var(--v-or)}

.card{position:absolute; background:var(--v-bg); border-radius:38px; overflow:hidden;
  box-shadow:0 1px 2px rgba(40,20,5,.05), 0 0 0 2px rgba(40,25,10,.045), 0 40px 90px -30px rgba(70,35,10,.28), 0 12px 30px -16px rgba(70,35,10,.18)}
.wh{height:88px; display:flex; align-items:center; gap:18px; padding:0 34px; border-bottom:2px solid var(--v-line); font:500 27px var(--sans); color:var(--v-ink2); letter-spacing:-.01em}
.dots{display:flex; gap:10px}
.dots i{width:18px; height:18px; border-radius:50%; background:#FF5F57}
.dots i:nth-child(2){background:#FEBC2E} .dots i:nth-child(3){background:#28C840}
.chip{display:inline-flex; align-items:center; gap:10px; height:52px; padding:0 22px; border-radius:999px; font:600 26px var(--sans); letter-spacing:-.01em; white-space:nowrap}
.chip.soft{background:var(--v-soft); color:var(--v-or)}
.chip.ink{background:var(--v-ink); color:#fff}
.chip.line{background:var(--v-bg); color:var(--v-ink); box-shadow:0 0 0 2px var(--v-line), 0 18px 40px -20px rgba(70,35,10,.3)}
.chip .dot{width:14px; height:14px; border-radius:50%; background:var(--v-or)}

.row{display:flex; align-items:center; gap:22px; padding:0 34px; height:86px; font:500 31px var(--sans); color:var(--v-ink); letter-spacing:-.015em}
.row + .row{border-top:2px solid var(--v-line)}
.row em{margin-left:auto; font:500 24px var(--mono); color:var(--v-mute); font-style:normal}
.ck{width:42px; height:42px; border-radius:50%; border:3px solid #DCD6D0; flex:none; display:grid; place-items:center; transition:none}
.ck svg{width:24px; height:24px; opacity:0}
.on .ck{background:var(--v-or); border-color:var(--v-or)}
.on .ck svg{opacity:1}
.row.on span.t{color:var(--v-mute)}

.bigNum{font:800 92px/1 var(--sans); letter-spacing:-.05em; font-variant-numeric:tabular-nums}
.lbl{font:500 26px var(--sans); color:var(--v-ink2); letter-spacing:-.01em}
.mono{font-family:var(--mono)}
.caret{display:inline-block; width:4px; height:.95em; background:var(--v-or); vertical-align:-.12em; margin-left:4px; border-radius:2px}

/* legendas */
#cap{position:absolute; left:0; right:0; top:1520px; height:120px; z-index:90}
.capline{position:absolute; left:60px; right:60px; top:0; text-align:center; white-space:nowrap; font:600 64px/1.1 var(--sans); letter-spacing:-.025em}
.capline span{display:inline-block; margin:0 .13em; text-shadow:0 0 18px #fff, 0 0 6px #fff}
</style>

<div class="app">
  <div class="player">
    <div class="vp" id="vp">
      <div id="stage" aria-label="Animação: O futuro já começou"></div>
      <button class="poster" id="poster" aria-label="Assistir animação"><span><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span></button>
    </div>
    <div class="ctrl">
      <button class="btn primary" id="play" aria-label="Iniciar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg><span>Iniciar</span></button>
      <button class="btn" id="restart" aria-label="Reiniciar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg><span>Reiniciar</span></button>
      <input type="range" id="scrub" min="0" max="30" step="0.01" value="0" aria-label="Posição na animação">
      <span class="time" id="time">00:00 / 00:30</span>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="sfx" checked> Efeitos sonoros</label>
      <label><input type="checkbox" id="caps" checked> Legendas</label>
    </div>
  </div>

  <div class="side">
    <h1>O futuro <em>já começou.</em></h1>
    <p class="lede">Peça de 30 segundos em motion design, sincronizada palavra por palavra com a narração. Clique numa cena para ir direto a ela.</p>
    <div class="meta"><span>1080×1920 · 9:16</span><span>30 fps</span><span>30 s</span><span>7 cenas</span></div>
    <ol class="scene-list" id="scenes"></ol>
  </div>
</div>

<audio id="vo" preload="auto" src="__AUDIO__"></audio>

<script>

const DUR = 30;
const CONFIG = { handle: "" };   // ex.: "@seuperfil" para aparecer na cartela final

const stage = document.getElementById("stage");
function h(tag, cls, parent, html, css) {

const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const SVGNS = "http://www.w3.org/2000/svg";

const bg = h("div", "layer", stage, null, "z-index:1");

  s3: [[-220, 1560], [110, 1330], [120, 900], [270, 430], [640, 250], [990, 520], [1010, 1010], [720, 1360], [520, 2120]],
  s4: [[1260, 160], [960, 300], [720, 470], [860, 820], [1020, 1120], [840, 1420], [480, 1520], [140, 1720], [-240, 2020]],
  s5: [[-260, 1190], [-20, 1210], [170, 1165], [360, 1195], [540, 1180], [720, 1165], [905, 1200], [1090, 1170], [1330, 1185]],
  s6: ring(540, 1120, 312, 312, -100, 384),

/* [t, pose] — a fita interpola entre poses */
const RIB = [[0, "intro"], [2.55, "intro"], [3.45, "s2"], [6.8, "s2"], [7.7, "s3"], [12.0, "s3"], [12.85, "s4"], [19.75, "s4"], [20.55, "s5"], [21.95, "s5"], [22.85, "s6"], [25.9, "s6"], [26.8, "end"]];
function ribbonPts(t) {

}
